<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>My zoo</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <style>
        body{
            text-align:center;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            padding: 35px;
            background-color: lightgreen;
        }
        h1{
            color:crimson;
        }
        #zoo{
            border:2px solid crimson;
            width: 300px;
            margin:16px auto;
            padding:12px;
            border: radius 10px;
            background-color: bisque;

        }
        zone{
            border: 1px solid crimson;
            margin: 6px ;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: left;
        
        }
        button{
            background-color: crimson;
            color:bisque;
            padding: 10px 24px;
            border-radius:20px;
            cursor: pointer;
        }
    </style>
    <body>
        <h1>My Zoo</h1>
        <p>Uses Javascript and the DOM for this activity</p>    
        <div id="zoo">
            <div class="zone">Zone1: <span id="zone1"></span></div>
            <div class="zone">Zone2: <span id="zone2"></span></div>
            <div class="zone">Zone3: <span id="zone3"></span></div>
            <div class="zone">Zone4: <span id="zone4"></span></div>
            <div class="zone">Total animals: <span id="total"></span></div>
            <button onclick="openzoo()">Open the zoo</button>
            <p id="status"></p>
            <script>
                function openzoo(){
                    document.getElementById("zone1").innerHTML= "Lion"
                    document.getElementById("zone2").innerHTML= "Deer"
                    document.getElementById("zone3").innerHTML= "Snake"
                    document.getElementById("zone4").innerHTML= "Panther"
                    document.getElementById("total").innerHTML= "4"
                    document.getElementById("zoo").style.backgroundColor="skyblue"
                    document.getElementById("status").innerHTML=document.title + " is now open";

                }
            </script>
        </div>
    </body>
</html>
