<!DOCTYPE html>

<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>My favourite person profile</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">

        <style>
            body {
                background-color: skyblue;
                color: black;
                font-family: Arial, sans-serif;
                padding: 20px;
            }

            .cards {
                width: 350px;
                margin: 0 auto;
            }

            .card {
                background-color: lightgreen;
                color: black;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            }

            .card-body {
                background-color: #f8fafc;
                color: blue;
                padding: 15px;
                border-radius: 8px;
            }

            .card-title {
                background-color: #0284c7;
                color: lightgreen;
                padding: 10px;
                border-radius: 6px;
                font-size: 22px;
                margin-top: 0;
            }

            h3 {
                color: #334155;
            }

            span {
                color: #0284c7;
            }

            button {
                background-color: #0284c7;
                color: #ffffff;
                border: none;
                padding: 10px 20px;
                border-radius: 6px;
                font-size: 16px;
                cursor: pointer;
                margin-top: 10px;
            }

            button:hover {
                background-color: #0369a1;
            }
        </style>
    </head>
    <body>
        <div class="cards">
            <div class="card">
                <div class="card-body">
                    <h1 class="card-title">My favourite profile</h1>
                    <h3>Name: <span id="name"></span></h3>
                    <h3>Phone no: <span id="phone"></span></h3>
                    <h3>Age: <span id="age"></span></h3>
                    <button type="button" onclick="showAll()">View Profile</button>
                </div>
            </div>
        </div>

        <script>
            var student = {
                name: "Abdul Wasey",
                phone: "0325181916",
                age: "10"
            };

            var nameEl = document.getElementById("name");
            nameEl.textContent = student.name;

            var phoneEl = document.getElementById("phone");
            phoneEl.textContent = student.phone;

            var ageEl = document.getElementById("age");
            ageEl.textContent = student["age"];

            function showAll() {
                alert(
                    "Name: " + student.name + "\n" +
                    "Phone no: " + student.phone + "\n" +
                    "Age: " + student.age
                );
            }
        </script>
    </body>
</html>
